<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accent-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #f1f5f9;
    }
    .node-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #94a3b8;
    }
    
    /* Dynamic pulsing animations */
    @keyframes pulse-orb {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes glow-line {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }

    .orb-1 {
      animation: pulse-orb 6s ease-in-out infinite;
      transform-origin: 200px 120px;
    }
    .orb-2 {
      animation: pulse-orb 8s ease-in-out infinite;
      animation-delay: -3s;
      transform-origin: 1000px 300px;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dash-flow 2.5s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 8 6;
      animation: dash-flow 3s linear infinite reverse;
    }
    .badge-float-1 {
      animation: float-badge 4s ease-in-out infinite;
    }
    .badge-float-2 {
      animation: float-badge 4.5s ease-in-out infinite;
      animation-delay: -1.5s;
    }
    .badge-float-3 {
      animation: float-badge 5s ease-in-out infinite;
      animation-delay: -3s;
    }
    .live-pulse {
      animation: glow-line 2s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="100" r="140" fill="#38bdf8" opacity="0.25" filter="url(#soft-glow)" />
  <circle class="orb-2" cx="1020" cy="280" r="160" fill="#818cf8" opacity="0.25" filter="url(#soft-glow)" />

  <!-- Flowing Architectural Pipelines in Lower Background -->
  <g opacity="0.8">
    <!-- On-Prem Client to Proxy Flow -->
    <path class="flow-line" d="M 230 330 L 460 330" fill="none" stroke="#38bdf8" stroke-width="3" />
    <!-- Proxy to Cloud Flow -->
    <path class="flow-line" d="M 640 330 L 870 330" fill="none" stroke="#a855f7" stroke-width="3" />
    <!-- Secondary Replication Flow (Curved) -->
    <path class="flow-line-reverse" d="M 550 300 Q 700 240 890 310" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Architectural Interactive Cards -->
  <!-- Node 1: On-Premises Workloads / Agent -->
  <g transform="translate(90, 290)">
    <rect width="160" height="76" rx="10" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="38" r="14" fill="rgba(56, 189, 248, 0.15)" />
    <path d="M 22 38 L 28 44 L 35 32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="52" y="34" class="node-text">Endpoints</text>
    <text x="52" y="49" class="node-sub">On-Prem Agent</text>
    <circle class="live-pulse" cx="140" cy="20" r="4" fill="#38bdf8" />
  </g>

  <!-- Node 2: Central Backup Proxy / Data Mover -->
  <g transform="translate(450, 280)">
    <rect width="200" height="94" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="2" filter="url(#glow-cyan)" />
    <rect width="200" height="94" rx="12" fill="url(#card-grad)" stroke="rgba(129, 140, 248, 0.6)" stroke-width="1.5" />
    <circle cx="36" cy="47" r="18" fill="rgba(129, 140, 248, 0.2)" />
    <!-- Transfer Icon -->
    <path d="M 28 44 L 44 44 M 38 38 L 44 44 L 38 50" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="42" class="node-text">Backup Proxy</text>
    <text x="64" y="58" class="node-sub">Dedupe &amp; Encryption Engine</text>
    <circle class="live-pulse" cx="180" cy="22" r="4.5" fill="#10b981" />
  </g>

  <!-- Node 3: Cloud Target / Object Storage -->
  <g transform="translate(860, 290)">
    <rect width="170" height="76" rx="10" fill="url(#card-grad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="38" r="14" fill="rgba(168, 85, 247, 0.15)" />
    <path d="M 23 41 C 23 35, 28 32, 33 34 C 36 30, 42 32, 42 36 C 45 36, 47 38, 47 41 Z" fill="none" stroke="#c084fc" stroke-width="1.8" />
    <text x="52" y="34" class="node-text">Cloud Storage</text>
    <text x="52" y="49" class="node-sub">S3 / Immutable Vault</text>
    <circle class="live-pulse" cx="150" cy="20" r="4" fill="#c084fc" />
  </g>

  <!-- Floating Dynamic Feature Badges (Top right) -->
  <g class="badge-float-1" transform="translate(820, 60)">
    <rect width="140" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <text x="70" y="21" class="badge-text" fill="#38bdf8" text-anchor="middle">⚡ Zero-Trust Proxies</text>
  </g>
  <g class="badge-float-2" transform="translate(980, 60)">
    <rect width="135" height="32" rx="16" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1" />
    <text x="67" y="21" class="badge-text" fill="#c084fc" text-anchor="middle">🔒 Global Dedupe</text>
  </g>
  <g class="badge-float-3" transform="translate(890, 110)">
    <rect width="165" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
    <text x="82" y="21" class="badge-text" fill="#34d399" text-anchor="middle">🛡️ Immutable Storage</text>
  </g>

  <!-- High-Contrast Foreground Header & Subtitle (Always in front) -->
  <!-- Category Pill -->
  <g transform="translate(90, 68)">
    <rect width="275" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8" />
    <text x="28" y="19" class="badge-text" fill="#7dd3fc">HYBRID CLOUD DATA PROTECTION</text>
  </g>

  <!-- Main Title -->
  <text x="90" y="145" class="title-text">
    Awesome <tspan fill="url(#accent-cyan-blue)">Backup Proxy</tspan> &amp; Agent
  </text>

  <!-- Subtitle -->
  <text x="90" y="185" class="subtitle-text">
    Curated SaaS Platforms, Enterprise Media Agents &amp; Open-Source Data Movers
  </text>

  <!-- Gradient Divider -->
  <rect x="90" y="210" width="620" height="2" rx="1" fill="url(#accent-cyan-blue)" opacity="0.8" />

  <!-- Tagline / Sub-metadata -->
  <text x="90" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#64748b">
    High-Throughput Transport • End-to-End Encryption • Multi-Cloud &amp; Air-Gapped Resiliency
  </text>
</svg>
